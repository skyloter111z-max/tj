# XcodeGen 설정. Mac에서: brew install xcodegen && cd ios && xcodegen && open Submoa.xcodeproj
name: Submoa
options:
  bundleIdPrefix: kr.submoa
  deploymentTarget:
    iOS: "17.0" # 단축어 메시지 자동화의 "즉시 실행"과 AppShortcut(shortTitle:)이 17부터다

packages:
  SubmoaCore:
    path: SubmoaCore

targets:
  Submoa:
    type: application
    platform: iOS
    sources:
      - Submoa
    dependencies:
      - package: SubmoaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.submoa.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 구독모아
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        # 아래 스크립트가 번들에 웹 파일을 쓰려면 샌드박스를 꺼야 한다
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Copy web app
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "$SRCROOT/../out/onboarding.html" ]; then
            echo "warning: out/이 없습니다. 저장소 루트에서 npm run export를 먼저 실행하세요."
            exit 0
          fi
          rsync -a --delete "$SRCROOT/../out/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web/"
